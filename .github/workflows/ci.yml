name: CI

on:
    push:
        branches: [main, "release/**"]
    pull_request:
        branches: [main, "release/**"]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                # 22 matches the Node version release.yml publishes with
                node-version: [18, 20, 22]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v3

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Type check
              run: pnpm typecheck

            - name: Run tests
              run: pnpm test

            - name: Validate doc YAML snippets
              run: pnpm docs:validate-snippets

    # No linter is configured in this repo (yet) -- this job builds and
    # typechecks on a single Node version, so it is named for what it does.
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v3
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Type check
              run: pnpm typecheck

    # A "chore: version packages" PR must consume EVERY changeset on main, not
    # just the ones that existed when it was cut. changesets/action only takes
    # the publish path when .changeset/ holds no changesets; merging a version
    # PR onto a main that has since accumulated more produces another version
    # PR instead of a release, silently deferring it.
    #
    # That is not hypothetical: PR #51 was cut from 7 changesets on 2026-07-26,
    # 4 more landed on main, and merging it staged a 0.4.0 missing four of its
    # own features. It reached main because Actions was not dispatching, so the
    # action never regenerated the branch. This check is the backstop for
    # exactly that -- the branch being stale rather than the diff looking stale.
    #
    # actions/checkout builds the PR *merge commit* on pull_request events, so
    # the tree here is the state main will be in after merge. See ml-ook.
    #
    # Prerelease-mode subtlety: while .changeset/pre.json exists, `changeset
    # version` deliberately KEEPS consumed .md files on disk (they are
    # re-applied at the stable `pre exit` versioning) and records consumption
    # in pre.json's "changesets" array instead of deleting. So in pre mode a
    # surviving file is only stale if its name is absent from that array.
    version-pr-completeness:
        name: Version PR consumes every changeset
        if: github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout PR merge commit
              uses: actions/checkout@v4

            - name: Assert no changeset survives the merge
              run: |
                  leftover=$(find .changeset -name '*.md' ! -name 'README.md' -printf '%f\n' | sed 's/\.md$//' | sort)
                  if [ -f .changeset/pre.json ]; then
                      leftover=$(comm -23 <(printf '%s\n' "$leftover") <(jq -r '.changesets[]' .changeset/pre.json | sort))
                  fi
                  if [ -n "$leftover" ]; then
                      echo "::error::This version PR does not consume every changeset on main. Merging it would open another version PR instead of publishing."
                      echo ""
                      echo "Unconsumed changesets that would survive the merge:"
                      echo "$leftover" | sed 's/^/  /'
                      echo ""
                      echo "Fix: push to main (or re-run the Release workflow) so changesets/action"
                      echo "regenerates changeset-release/main against current main, then merge the"
                      echo "regenerated PR."
                      exit 1
                  fi
                  echo "No unconsumed changeset survives the merge -- the publish path will fire."

    # Drives the Phase 1 fixtures against a real MapLibre instance in headless
    # Chromium. The unit suites can only prove we handed MapLibre a given
    # object; these prove a user sees the result. Added after a change meant to
    # fix attribution silently removed attribution from every map -- green
    # across 911 unit tests, caught only in a browser.
    #
    # Every asset (maplibre-gl, its CSS, the basemap style, the DEM tiles) is
    # served locally by e2e/server.mjs, so no external service can turn this
    # red. That is what makes it safe as a required check.
    #
    # The maplibre-version matrix (U1, ml-tfd.1) runs the suites against both
    # ends of the supported peer range. The peer range advertised ^3||^4||^5
    # while CI tested only one pinned version -- the v5 named-import break
    # shipped undetected in 0.2.1/0.2.2. A pnpm override forces every
    # workspace package (and the e2e vendor resolution) onto the matrix
    # version, so the advertised range is the tested range.
    browser-verification:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                maplibre-version: ["^4.7.1", "^5.24.0"]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v3
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            # pnpm 9 (the pinned packageManager) reads overrides from
            # package.json; pnpm 10 moved them to pnpm-workspace.yaml and
            # silently ignores this field. If packageManager is ever bumped,
            # move this write — the assert step below turns that mistake into
            # a red leg instead of a silent no-op.
            - name: Pin maplibre-gl ${{ matrix.maplibre-version }} via pnpm override
              env:
                  MAPLIBRE_VERSION: ${{ matrix.maplibre-version }}
              run: |
                  node -e "
                    const fs = require('fs');
                    const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                    pkg.pnpm = pkg.pnpm ?? {};
                    pkg.pnpm.overrides = { ...pkg.pnpm.overrides, 'maplibre-gl': process.env.MAPLIBRE_VERSION };
                    fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
                  "

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            # Fails the leg when any resolution the suites use does not carry
            # the matrix major — without this the override could silently
            # no-op and both legs would green-run the same version.
            - name: Assert resolved maplibre-gl matches the matrix leg
              env:
                  MAPLIBRE_VERSION: ${{ matrix.maplibre-version }}
              run: |
                  node -e "
                    const path = require('path');
                    const want = process.env.MAPLIBRE_VERSION.match(/\d+/)[0];
                    for (const p of ['.', 'packages/core', 'packages/astro']) {
                      const v = require(path.resolve(p, 'node_modules/maplibre-gl/package.json')).version;
                      console.log(p, 'maplibre-gl', v);
                      if (v.split('.')[0] !== want) {
                        console.error('matrix leg wants major ' + want + ', resolved ' + v + ' in ' + p);
                        process.exit(1);
                      }
                    }
                  "

            - name: Resolve Playwright version
              id: pw
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: pw-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

            # --with-deps only on a cache miss: it needs apt and is the slow part.
            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium
              if: steps.pw-cache.outputs.cache-hit != 'true'

            - name: Install Chromium system deps
              run: pnpm exec playwright install-deps chromium
              if: steps.pw-cache.outputs.cache-hit == 'true'

            - name: Build
              run: pnpm build

            - name: Run core unit tests against the matrix version
              run: pnpm --filter @maplibre-yaml/core test

            # examples/react has its own job below, one leg per React major,
            # on the maplibre-gl it declares (its demo reads `global-state`,
            # a >=5.6 expression the v4 leg cannot run).
            - name: Run browser verification
              env:
                  REACT_MAJORS: none
              run: pnpm verify:browser

            - name: Upload report on failure
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: browser-verification-report-${{ strategy.job-index }}
                  path: |
                      e2e/report
                      e2e/results
                  retention-days: 7

    # examples/react (U21, Amendment A3 / D-A11): the documented React
    # integration as a real Vite + TypeScript app, on every supported React
    # major. One lockfile carries both majors (npm aliases `react-18` /
    # `react-dom-18` / `react-types-18`), so each leg is a frozen install plus
    # a mode switch rather than a rewritten package.json: `--mode react18`
    # aliases React 18 into the bundle, tsconfig.react18.json points the
    # type-check at @types/react 18. Each leg builds the production AND the
    # development bundle (StrictMode is only live in development) and drives
    # both in Chromium via e2e/react-example.spec.ts: maps render, events
    # reach React, mapReady() resolves, an equal config does not rebuild the
    # map, unmount leaves no canvas. The page asserts React.version, so a leg
    # that silently bundled the other major fails.
    react-example:
        name: React example (React ${{ matrix.react }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                react: ["18", "19"]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v3
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Resolve Playwright version
              id: pw
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: pw-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium
              if: steps.pw-cache.outputs.cache-hit != 'true'

            - name: Install Chromium system deps
              run: pnpm exec playwright install-deps chromium
              if: steps.pw-cache.outputs.cache-hit == 'true'

            - name: Build core
              run: pnpm --filter @maplibre-yaml/core build

            - name: Type-check the example against @types/react ${{ matrix.react }}
              run: pnpm --filter @maplibre-yaml/example-react typecheck:react${{ matrix.react }}

            - name: Docs React snippets match the example
              run: pnpm --filter @maplibre-yaml/example-react test

            - name: Build the example for React ${{ matrix.react }} (production + development)
              run: pnpm --filter @maplibre-yaml/example-react build:react${{ matrix.react }}

            - name: Drive it in Chromium
              env:
                  REACT_MAJORS: ${{ matrix.react }}
              run: pnpm exec playwright test e2e/react-example.spec.ts

            - name: Upload report on failure
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: react-example-report-react${{ matrix.react }}
                  path: |
                      e2e/report
                      e2e/results
                  retention-days: 7

    # The Astro example site on every Astro major the peer range claims
    # (U20, ml-vw4.13; plan Amendment A3, D-A9/D-A11). The peer range said
    # ^4 || ^5 while nothing ran either, and Astro 6/7 broke every
    # content-collection helper (zod 3 vs 4) without a red check anywhere.
    #
    # scripts/astro-matrix.mjs packs core + astro, installs the example site
    # OUTSIDE the workspace with npm (no --legacy-peer-deps, so the peer range
    # itself is under test), then runs astro check, astro build, the full
    # Playwright suite against astro preview, and the @dev smoke tests against
    # astro dev (the audit's npm-install dev-mode break never shows in a
    # build). Hermetic: the suite stubs the basemap style and fails on any
    # other off-origin request.
    astro-example:
        name: Astro ${{ matrix.astro }} example site
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                astro: ["4", "5", "6", "7"]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v3

            # Astro 7 needs Node >= 22.12; 4-6 run on it too.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Resolve Playwright version
              id: pw
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: pw-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium
              if: steps.pw-cache.outputs.cache-hit != 'true'

            - name: Install Chromium system deps
              run: pnpm exec playwright install-deps chromium
              if: steps.pw-cache.outputs.cache-hit == 'true'

            - name: Cache npm (the matrix site installs with npm)
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-astro-${{ matrix.astro }}-${{ hashFiles('examples/astro/site/package.json') }}
                  restore-keys: npm-astro-${{ matrix.astro }}-

            - name: Build core
              run: pnpm --filter @maplibre-yaml/core build

            - name: Build and drive the example site on Astro ${{ matrix.astro }}
              env:
                  ASTRO_MATRIX_DIR: ${{ runner.temp }}/astro-matrix
              run: node scripts/astro-matrix.mjs --majors ${{ matrix.astro }}

            - name: Upload Playwright results on failure
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: astro-${{ matrix.astro }}-example-results
                  path: ${{ runner.temp }}/astro-matrix/results-*
                  retention-days: 7
