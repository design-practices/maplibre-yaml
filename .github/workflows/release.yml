name: Release

on:
  push:
    branches:
      - main
      # Maintenance lines (e.g. release/0.6.x, branched from a release tag).
      # changesets/action opens the "Version Packages" PR against the branch
      # that was pushed, and publishing from it uses a non-`latest` dist-tag
      # once main has released a newer minor (see scripts/release.sh).
      - "release/**"

# Queue, never cancel: a push that lands while a version PR's merge is
# publishing must not cancel that run mid-publish (it happened to
# 0.6.0-alpha.1, ml-tfd.9). A queued run re-checks state and publishes
# nothing new, so waiting is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create releases, push tags, merge PRs
      pull-requests: write # Create "Version Packages" PR
      id-token: write # Required for npm OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # trusted publishing needs Node >= 22.14
          cache: "pnpm"
          # No registry-url: setup-node would write an .npmrc with an
          # `_authToken=${NODE_AUTH_TOKEN}` placeholder, and a token in npm's
          # config shadows the OIDC exchange. The default registry is npmjs.

      # npm trusted publishing (OIDC): `pnpm publish` (pnpm 9) packs each
      # package and hands the tarball to the npm CLI on PATH, so npm is what
      # authenticates. OIDC needs npm >= 11.5.1; Node 22 bundles npm 10.
      # That bundled npm 10 — not pnpm — is why the first OIDC attempt
      # (0.3.0) went out unauthenticated and npm answered E404 (todo 038).
      - name: Use npm 11 for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # Dry-run gate: pack each publishable package and fail if the
      # resulting manifest still contains workspace: refs (the bug that
      # shipped in 0.2.0). See scripts/check-publish.sh (issue #28).
      - name: "Check publish manifests (workspace: guard)"
        run: |
          for pkg in packages/core packages/cli packages/astro packages/effects packages/maplibre-yaml; do
            ./scripts/check-publish.sh "$pkg"
          done

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # `changeset version`, then the CDN pins in docs/READMEs/examples
          # move to the new minor (scripts/sync-cdn-pins.mjs, ml-aot.92), so
          # the release PR never ships docs pointing at the previous line.
          version: pnpm run version-packages
          # MUST be a single command, not a shell line. changesets/action
          # splits this input on whitespace and runs it through @actions/exec
          # with no shell, so an `&&` here is passed as a literal argument to
          # the first command rather than chaining. The previous value,
          #     pnpm publish -r --access public && pnpm changeset tag
          # therefore ran `pnpm publish` with the args `&& pnpm changeset tag`
          # and never tagged anything: 13 releases published, 2 tags in the
          # repo, 0 GitHub releases (ml-5ym). The chaining now lives in the
          # `release` script, where a shell does interpret it.
          #
          # `pnpm publish` (not `changeset publish`, which bypasses pnpm's
          # workspace:-protocol rewriting — issue #28) does not create git
          # tags; `changeset tag` creates them, and the script pushes them
          # itself rather than relying on the action to parse "New tag:" out
          # of stdout. See todo 038 / U16.
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token: npm authenticates with this job's OIDC identity
          # (`id-token: write` above) against each package's trusted publisher
          # on npmjs.com (design-practices/maplibre-yaml, release.yml), and
          # attaches provenance. See ml-101 for the npmjs.com setup.
