name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create releases, push tags, merge PRs
      pull-requests: write # Create "Version Packages" PR
      id-token: write # Required for npm OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Node 22 includes npm 11.x
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # Dry-run gate: pack each publishable package and fail if the
      # resulting manifest still contains workspace: refs (the bug that
      # shipped in 0.2.0). See scripts/check-publish.sh (issue #28).
      - name: "Check publish manifests (workspace: guard)"
        run: |
          for pkg in packages/core packages/cli packages/astro; do
            ./scripts/check-publish.sh "$pkg"
          done

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          # MUST be a single command, not a shell line. changesets/action
          # splits this input on whitespace and runs it through @actions/exec
          # with no shell, so an `&&` here is passed as a literal argument to
          # the first command rather than chaining. The previous value,
          #     pnpm publish -r --access public && pnpm changeset tag
          # therefore ran `pnpm publish` with the args `&& pnpm changeset tag`
          # and never tagged anything: 13 releases published, 2 tags in the
          # repo, 0 GitHub releases (ml-5ym). The chaining now lives in the
          # `release` script, where a shell does interpret it.
          #
          # `pnpm publish` (not `changeset publish`, which bypasses pnpm's
          # workspace:-protocol rewriting — issue #28) does not create git
          # tags; `changeset tag` creates them, and the script pushes them
          # itself rather than relying on the action to parse "New tag:" out
          # of stdout. See todo 038 / U16.
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Granular npm automation token (packages: @maplibre-yaml/*).
          # The pinned pnpm 9 cannot mint npm OIDC trusted-publishing tokens
          # (support landed in pnpm 10.13) -- without this, the publish PUT
          # goes out unauthenticated and npm masks it as E404. See todo 038
          # for the migration to true OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
