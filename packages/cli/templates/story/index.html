<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Without this line, phones lay the page out at desktop width and the story looks tiny. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>

  <!-- MapLibre's stylesheet. Keep it on the same major version (6) as the import map below. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6/dist/maplibre-gl.css">

  <!-- Tells the browser where "maplibre-gl" lives. The story's map needs it. -->
  <script type="importmap">
    { "imports": { "maplibre-gl": "https://unpkg.com/maplibre-gl@6/dist/maplibre-gl.mjs" } }
  </script>

  <!-- Registers the <ml-scrollytelling> element. "@{{coreMinor}}" means the newest {{coreMinor}}.x release. -->
  <script type="module" src="https://unpkg.com/@maplibre-yaml/core@{{coreMinor}}/register.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <!--
    The story is described in story.yaml: one chapter per section, each with
    its own camera. Edit it and reload the page.

    Publishing on GitHub Pages as a project site (you.github.io/my-repo/)?
    Add base="/my-repo/" here so paths in story.yaml that start with "/" start
    there. Docs: Integrations > Web Components > "Sites under a subpath".
  -->
  <ml-scrollytelling src="story.yaml"></ml-scrollytelling>
</body>
</html>
