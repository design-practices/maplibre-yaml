# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/scrollytelling.schema.json
#
# Tips:
# - Indent with spaces (2 per level), never tabs.
# - Coordinates are [longitude, latitude].
# - Each chapter is one section of the story: its camera (center, zoom,
#   pitch, bearing) and its card (title, description as HTML, alignment).
# - Paths to your own files (an image, a data file) are relative to
#   index.html (images/photo.jpg), or start at the site root with "/"
#   (/images/photo.jpg). On GitHub Pages, see the base note in index.html.
# - Check this file for mistakes: npx @maplibre-yaml/cli validate story.yaml
type: scrollytelling
id: {{projectName}}
config:
  center: [-74.006, 40.7128]
  zoom: 10
  mapStyle: "https://tiles.openfreemap.org/styles/liberty"
  theme: "light"
chapters:
  - id: intro
    title: "Introduction"
    center: [-74.006, 40.7128]
    zoom: 10
    pitch: 0
    bearing: 0
    description: "Welcome to {{title}}. This is an example story map showcasing different locations."
    alignment: "left"

  - id: chapter-1
    title: "Chapter 1"
    center: [-118.2437, 34.0522]
    zoom: 11
    pitch: 0
    bearing: 0
    description: "This is the first chapter of our story. Each chapter can have its own viewpoint and description."
    alignment: "left"
