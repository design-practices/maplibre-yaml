# Builds the site and publishes it on GitHub Pages every time you push to main.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Also set `site` and `base` in astro.config.mjs (see the comment there).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
