# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
# A choropleth: tracts coloured by median income in five quantile classes.
# The breaks are computed from the data when it loads (GeoJSON source), and
# the legend shows their real edges. Tracts with no value draw light grey.
# No legend: block — a map with a classify: layer gets its legend
# automatically (legend: false turns it off).
# Data: synthetic tracts made for this example.
type: map
id: classify-choropleth
config:
  center: [-75.19, 39.936]
  zoom: 12
  mapStyle: "https://tiles.openfreemap.org/styles/positron"
sources:
  tracts:
    type: geojson
    url: /data/classify/sample-tracts.geojson
layers:
  - id: income
    type: fill
    source: tracts
    label: Median household income
    classify:
      field: median_income
      method: quantile
      classes: 5
      palette: Blues
      format: { currency: USD, max-fraction-digits: 0 }
    paint:
      fill-opacity: 0.85
      fill-outline-color: "#ffffff"
    interactive:
      click:
        popup:
          - h4:
              - property: tract
          - p:
              - str: "Median income: "
              - property: median_income
