# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
type: map
id: interactive-points
config:
  center: [-122.41, 37.775]
  zoom: 13
  bounds: [-122.425, 37.772, -122.384, 37.8]
  mapStyle: "https://tiles.openfreemap.org/styles/liberty"
layers:
  - id: places
    type: circle
    label: Place type        # the legend title
    source:
      type: geojson
      generateId: true       # ids for the hover highlight
      data:
        type: FeatureCollection
        features:
          - type: Feature
            geometry:
              type: Point
              coordinates: [-122.4194, 37.7793]
            properties:
              name: "City Hall"
              category: "government"
              address: "1 Dr Carlton B Goodlett Pl"
              rating: 4.2
          - type: Feature
            geometry:
              type: Point
              coordinates: [-122.3934, 37.7955]
            properties:
              name: "Ferry Building"
              category: "landmark"
              address: "1 Ferry Building"
              rating: 4.7
          - type: Feature
            geometry:
              type: Point
              coordinates: [-122.3893, 37.7786]
            properties:
              name: "Oracle Park"
              category: "sports"
              address: "24 Willie Mays Plaza"
              rating: 4.6
    classify:
      field: category
      categories:
        government: "#6366f1"
        landmark: "#f59e0b"
        sports: "#22c55e"
      other: "#6b7280"         # any category not listed
    paint:
      circle-radius: 14
      circle-stroke-width: 3
      circle-stroke-color: "#ffffff"
    interactive:
      hover:
        cursor: pointer
        highlight: true
      click:
        popup:
          - h3:
              - property: name
          - p:
              - str: "Address: "
              - property: address
          - p:
              - str: "Rating: "
              - property: rating
              - str: " / 5"
controls:
  navigation: true
