# One band of values from a Cloud Optimized GeoTIFF, coloured with
# colorRamp. The file holds a vegetation index (about -0.1 to 0.85); the
# sea has no values and stays clear. Synthetic, public-domain data.
type: map
id: cog-vegetation-demo
config:
  center: [10.2, 42.15]
  zoom: 9.4
  mapStyle: "https://tiles.openfreemap.org/styles/positron"
sources:
  vegetation:
    type: raster
    url: /gallery-assets/cloud-native/ndvi.cog.tif
    colorRamp: { palette: YlGn, min: 0, max: 0.85 }
layers:
  - id: vegetation
    type: raster
    source: vegetation
    paint: { raster-opacity: 0.9 }
    legend: { label: "Vegetation index, 0 (light) to 0.85 (dark)", color: "#41ab5d", shape: square }
