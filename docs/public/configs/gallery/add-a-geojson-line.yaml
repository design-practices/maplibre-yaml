# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
# Gallery twin of https://maplibre.org/maplibre-gl-js/docs/examples/add-a-geojson-line/
# The `route:` sugar stands in for the hand-built Feature<LineString>.
type: map
id: add-a-geojson-line
config:
  center: [-122.486052, 37.830348]
  zoom: 14
  mapStyle: "https://demotiles.maplibre.org/style.json"
layers:
