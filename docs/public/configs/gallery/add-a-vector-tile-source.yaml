# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
# Gallery twin of https://maplibre.org/maplibre-gl-js/docs/examples/add-a-vector-tile-source/
# A TileJSON url + source-layer, drawn over the same basemap's raster-free style.
type: map
id: add-a-vector-tile-source
config:
  center: [0, 20]
  zoom: 1
  mapStyle: "https://demotiles.maplibre.org/style.json"
layers:
  - id: country-outlines
    type: line
    source:
      type: vector
      url: "https://demotiles.maplibre.org/tiles/tiles.json"
    source-layer: countries
    paint:
      line-color: "#ff69b4"
      line-width: 1
