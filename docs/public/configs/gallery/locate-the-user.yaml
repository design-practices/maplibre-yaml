# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
# Gallery twin of https://maplibre.org/maplibre-gl-js/docs/examples/locate-the-user/
# The control tracks with high accuracy by default; click it and grant the
# browser permission.
type: map
id: locate-the-user
config:
  center: [-24, 42]
  zoom: 1
  mapStyle: "https://demotiles.maplibre.org/style.json"
controls:
  geolocate: true
