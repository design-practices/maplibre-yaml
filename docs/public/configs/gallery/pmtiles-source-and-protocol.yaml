# PMTiles vector source via the pmtiles:// protocol — YAML only since 0.9:
# maplibre-yaml registers the protocol itself when a source's URL is a
# pmtiles:// URL or a .pmtiles file. Data: Protomaps' Florence sample (ODbL).
# Hermetic tests: e2e/cloud-native.spec.ts (YAML-only, synthetic archives)
# and e2e/gallery-hatch.spec.ts (the page-registered route, stub protocol).
type: map
id: pmtiles-source-and-protocol
config:
  center: [11.2558, 43.7696]
  zoom: 12.5
  mapStyle: "https://demotiles.maplibre.org/style.json"
sources:
  firenze:
    type: vector
    url: "pmtiles://https://pmtiles.io/protomaps(vector)ODbL_firenze.pmtiles"
layers:
  - id: firenze-landuse
    type: fill
    source: firenze
    source-layer: landuse
    paint:
      fill-color: "#7b2cbf"
      fill-opacity: 0.25
  - id: firenze-roads
    type: line
    source: firenze
    source-layer: roads
    paint:
      line-color: "#5a189a"
      line-width: 1
