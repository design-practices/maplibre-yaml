# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
# Gallery twin of https://maplibre.org/maplibre-gl-js/docs/examples/create-a-hover-effect/
# The upstream version wires mousemove/mouseleave + setFeatureState by hand;
# here per-feature hover is one flag.
type: map
id: create-a-hover-effect
config:
  center: [-100.486, 37.83]
  zoom: 3.5
  mapStyle: "https://demotiles.maplibre.org/style.json"
layers:
  - id: states
    type: fill
    source:
      type: geojson
      data:
        type: FeatureCollection
        features:
          - type: Feature
            properties: { name: West Block }
            geometry:
              type: Polygon
              coordinates:
                - - [-109, 37]
                  - [-102, 37]
                  - [-102, 41]
                  - [-109, 41]
                  - [-109, 37]
          - type: Feature
            properties: { name: East Block }
            geometry:
              type: Polygon
              coordinates:
                - - [-101, 37]
                  - [-94.6, 37]
                  - [-94.6, 40]
                  - [-101, 40]
                  - [-101, 37]
    paint:
      fill-color: "#627BC1"
      fill-opacity: 0.6
    interactive:
      hover:
        highlight: true
        cursor: pointer
