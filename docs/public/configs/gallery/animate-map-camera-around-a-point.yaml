# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
# Gallery twin of https://maplibre.org/maplibre-gl-js/docs/examples/animate-map-camera-around-a-point/
# The YAML half: the pitched camera over Chicago. The orbit is a
# requestAnimationFrame loop calling rotateTo — see
# animate-map-camera-around-a-point.js.
type: map
id: animate-map-camera-around-a-point
config:
  center: [-87.62712, 41.89033]
  zoom: 15.5
  pitch: 45
  mapStyle: "https://tiles.openfreemap.org/styles/liberty"
