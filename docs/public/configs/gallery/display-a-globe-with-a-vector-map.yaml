# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
# Gallery twin of https://maplibre.org/maplibre-gl-js/docs/examples/display-a-globe-with-a-vector-map/
# Upstream calls setProjection in a style.load handler; here it is one key.
type: map
id: display-a-globe-with-a-vector-map
config:
  center: [0, 0]
  zoom: 2
  mapStyle: "https://demotiles.maplibre.org/style.json"
projection:
  type: globe
