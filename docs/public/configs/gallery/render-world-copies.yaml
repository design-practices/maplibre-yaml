# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
# Gallery twin of https://maplibre.org/maplibre-gl-js/docs/examples/render-world-copies/
# Pan east or west: with renderWorldCopies off there is exactly one world.
type: map
id: render-world-copies
config:
  center: [0, 20]
  zoom: 1
  renderWorldCopies: false
  mapStyle: "https://demotiles.maplibre.org/style.json"
