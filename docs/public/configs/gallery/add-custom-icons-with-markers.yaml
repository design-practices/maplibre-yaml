# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
# Gallery twin of https://maplibre.org/maplibre-gl-js/docs/examples/add-custom-icons-with-markers/
# icon: swaps the default pin for any image URL; a failed load falls back
# to the pin with one console note.
type: map
id: add-custom-icons-with-markers
config:
  center: [-65.017, -16.457]
  zoom: 5
  mapStyle: "https://demotiles.maplibre.org/style.json"
markers:
  - at: [-66.324462, -16.024695]
    icon: "https://commons.wikimedia.org/wiki/Special:FilePath/Cat_silhouette.svg?width=64"
    size: 1
  - at: [-61.21582, -15.971891]
    icon: "https://commons.wikimedia.org/wiki/Special:FilePath/Dog_silhouette.svg?width=64"
    size: 1.4
