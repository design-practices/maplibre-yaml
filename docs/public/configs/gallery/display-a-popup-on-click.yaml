# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
# Gallery twin of https://maplibre.org/maplibre-gl-js/docs/examples/display-a-popup-on-click/
# The whole click-handler + popup-DOM dance is one `interactive:` block.
type: map
id: display-a-popup-on-click
config:
  center: [-77.04, 38.907]
  zoom: 11.15
  mapStyle: "https://demotiles.maplibre.org/style.json"
layers:
  - id: places
    type: circle
    source:
      type: geojson
      data:
        type: FeatureCollection
        features:
          - type: Feature
            geometry: { type: Point, coordinates: [-77.038659, 38.931567] }
            properties:
              title: Make it Mount Pleasant
              description: A community art project in Mount Pleasant
          - type: Feature
            geometry: { type: Point, coordinates: [-77.003168, 38.894651] }
            properties:
              title: Capitol East Denizens
              description: Painted portraits of Capitol Hill East residents
          - type: Feature
            geometry: { type: Point, coordinates: [-77.090372, 38.881189] }
            properties:
              title: Arlington Mural
              description: A large-scale mural on the Arlington waterfront
          - type: Feature
            geometry: { type: Point, coordinates: [-77.052477, 38.943951] }
            properties:
              title: Rock Creek Trailhead
              description: Where the trail meets the neighborhood
    paint:
      circle-radius: 8
      circle-color: "#7c3aed"
      circle-stroke-width: 2
      circle-stroke-color: "#ffffff"
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: title
          - p:
              - property: description
