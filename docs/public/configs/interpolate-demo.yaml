type: map
id: quakes-by-magnitude
config:
  center: [-120, 37]
  zoom: 4
  mapStyle: "https://tiles.openfreemap.org/styles/liberty"
layers:
  - id: earthquakes
    type: circle
    source:
      type: geojson
      url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_week.geojson"
    paint:
      circle-radius: ["interpolate", ["linear"], ["get", "mag"], 1, 3, 6, 20]
      circle-color: ["interpolate", ["linear"], ["get", "mag"], 1, "#fef08a", 6, "#dc2626"]
      circle-opacity: 0.8
