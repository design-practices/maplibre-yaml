type: map
id: earthquakes-this-session
config:
  center: [-120, 37]
  zoom: 3
  mapStyle: "https://tiles.openfreemap.org/styles/liberty"
layers:
  - id: earthquakes
    type: circle
    source:
      type: geojson
      url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson"
      refresh:
        refreshInterval: 60000
        updateStrategy: merge
        updateKey: url        # a property that is different for every earthquake
    paint:
      circle-radius: ["interpolate", ["linear"], ["get", "mag"], 1, 3, 6, 20]
      circle-color: "#7c3aed"
      circle-opacity: 0.7
