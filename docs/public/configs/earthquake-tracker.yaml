# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
type: map
id: earthquake-tracker
config:
  center: [-120, 40]
  zoom: 4
  mapStyle: "https://tiles.openfreemap.org/styles/liberty"
layers:
  - id: earthquakes
    type: circle
    source:
      type: geojson
      url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_week.geojson"
      refresh:
        refreshInterval: 60000     # fetch again every 60 seconds
        updateStrategy: replace    # each response is the full list
      cache:
        enabled: false             # live data: fetch on every poll
    paint:
      circle-color:
        - interpolate
        - ["linear"]
        - ["get", "mag"]
        - 0
        - "#22c55e"   # magnitude 0: green
        - 2
        - "#eab308"   # 2: yellow
        - 4
        - "#f97316"   # 4: orange
        - 6
        - "#dc2626"   # 6 and above: red
      circle-radius:
        - interpolate
        - ["linear"]
        - ["get", "mag"]
        - 0
        - 3
        - 2
        - 6
        - 4
        - 12
        - 6
        - 24
      circle-opacity: 0.75
      circle-stroke-width: 1
      circle-stroke-color: "#ffffff"
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: title
          - p:
              - str: "Magnitude: "
              - property: mag
                format: { max-fraction-digits: 1 }
controls:
  navigation: true
  scale: true
