type: map
id: clustered-earthquakes
config:
  center: [-120, 37]
  zoom: 3
  mapStyle: "https://tiles.openfreemap.org/styles/liberty"
sources:
  earthquakes:
    type: geojson
    url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson"
    cluster: true
    clusterRadius: 50     # pixels: points this close are grouped
    clusterMaxZoom: 14    # from zoom 15, every point is drawn alone
layers:
  - id: clusters
    type: circle
    source: earthquakes
    filter: ["has", "point_count"]
    paint:
      circle-color: "#3b82f6"
      circle-opacity: 0.8
      circle-radius: ["step", ["get", "point_count"], 20, 100, 30, 750, 40]
  - id: cluster-count
    type: symbol
    source: earthquakes
    filter: ["has", "point_count"]
    layout:
      text-field: "{point_count_abbreviated}"
      text-size: 12
  - id: unclustered
    type: circle
    source: earthquakes
    filter: ["!", ["has", "point_count"]]
    paint:
      circle-radius: 6
      circle-color: "#ef4444"
