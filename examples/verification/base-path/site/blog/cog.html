<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Base path: COG files on a project site</title>
  <!--
    ml-cnv.2 — Cloud Optimized GeoTIFFs on a GitHub Pages project site
    (/my-repo/), from a page one folder down. The document names its files
    by site path, with no repo name: `cloud-native/imagery.cog.tif` (bare
    relative) and `cog:///cloud-native/elevation.cog.tif` (the path INSIDE
    the cog:// URL is what gets rebased).
    PASS (left, base="/my-repo/") = shaded island imagery, no notice. The
    right map is the same document without base: its notice says the files
    weren't found — which is what makes the left one mean something.
    Open: http://localhost:4174/my-repo/blog/cog.html
  -->
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 8px 16px; background: #1d3557; color: white; font-size: 13px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
    ml-map { display: block; height: 400px; }
  </style>
  <script type="importmap">
    { "imports": { "maplibre-gl": "/vendor/maplibre-gl.esm.js" } }
  </script>
</head>
<body>
  <header>Left (base="/my-repo/") PASS = shaded island imagery, no notice. Right (no base) = the files aren't found.</header>
  <main>
    <ml-map id="with-base" base="/my-repo/">
      <script type="text/yaml">
type: map
id: cog-base
config:
  center: [10.2, 42.15]
  zoom: 9.6
  mapStyle: styles/basemap.json
sources:
  imagery:
    type: raster
    url: cloud-native/imagery.cog.tif
  elevation:
    type: raster-dem
    url: cog:///cloud-native/elevation.cog.tif
layers:
  - { id: imagery, type: raster, source: imagery }
  - { id: hills, type: hillshade, source: elevation }
      </script>
    </ml-map>
    <ml-map id="no-base">
      <script type="text/yaml">
type: map
id: cog-no-base
config:
  center: [10.2, 42.15]
  zoom: 9.6
  mapStyle: "/examples/verification/configs/local-style.json"
sources:
  imagery:
    type: raster
    url: cloud-native/imagery.cog.tif
  elevation:
    type: raster-dem
    url: cog:///cloud-native/elevation.cog.tif
layers:
  - { id: imagery, type: raster, source: imagery }
  - { id: hills, type: hillshade, source: elevation }
      </script>
    </ml-map>
  </main>
  <script type="module" src="/packages/core/register.js"></script>
</body>
</html>
