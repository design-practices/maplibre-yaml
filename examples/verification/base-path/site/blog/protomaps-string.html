<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Base path: a Protomaps basemap named by its file alone</title>
  <!--
    ml-aot.115 — `mapStyle: protomaps/brooklyn.pmtiles`, a string naming the
    .pmtiles file, is the Protomaps basemap shorthand with its defaults (the
    light flavor, labels in the page's language, Protomaps' hosted fonts and
    icons), on a GitHub Pages project site (/my-repo/) with no page JavaScript.
    `mlym validate` notes how it is read and shows the { pmtiles: … } form
    for choosing a flavor or language.
    PASS: the light basemap with street and place labels; no error card.
    Serve from the repo root:  pnpm verify:serve
    Then open: http://localhost:4174/my-repo/blog/protomaps-string.html
  -->
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 8px 16px; background: #1d3557; color: white; font-size: 13px; }
    ml-map { display: block; height: 420px; margin: 8px; }
  </style>
  <script type="importmap">
    { "imports": { "maplibre-gl": "/vendor/maplibre-gl.esm.js" } }
  </script>
</head>
<body>
  <header>PASS = the light Protomaps basemap with labels, from mapStyle written as just the .pmtiles file.</header>
  <ml-map id="string" base="/my-repo/">
    <script type="text/yaml">
type: map
id: protomaps-string
config:
  center: [-73.9935, 40.6985]
  zoom: 14.6
  mapStyle: protomaps/brooklyn.pmtiles
layers: []
    </script>
  </ml-map>
  <script type="module" src="/packages/core/register.js"></script>
</body>
</html>
