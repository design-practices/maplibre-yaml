<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A COG from the CDN build, plain HTML</title>
  <!--
    0.9 (ml-cnv.2): the documented zero-build pattern — one module script
    from the CDN, an import map that maps ONLY maplibre-gl — reads a Cloud
    Optimized GeoTIFF with no page JavaScript. The COG reader decodes in
    background workers it starts from blob: URLs; nothing else is needed.
    The e2e server mounts packages/core at /cdn/@maplibre-yaml/core@<version>/,
    the way unpkg/jsDelivr serve the published package.
    PASS = the island imagery with shading; no notice.
    Serve from the repo root:  pnpm verify:serve
    Then open: http://localhost:4174/examples/verification/cloud-native/cdn-cog.html
  -->
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 8px 16px; background: #1d3557; color: white; font-size: 13px; }
    ml-map { display: block; height: 420px; }
  </style>
  <script type="importmap">
    { "imports": { "maplibre-gl": "/vendor/maplibre-gl.esm.js" } }
  </script>
</head>
<body>
  <header>CDN build, plain HTML — PASS = shaded island imagery, no notice.</header>
  <ml-map id="map">
    <script type="text/yaml">
type: map
id: cog-cdn
config:
  center: [10.2, 42.15]
  zoom: 9.6
  mapStyle: "/examples/verification/configs/local-style.json"
sources:
  imagery:
    type: raster
    url: /gallery-assets/cloud-native/imagery.cog.tif
  elevation:
    type: raster-dem
    url: /gallery-assets/cloud-native/elevation.cog.tif
layers:
  - { id: imagery, type: raster, source: imagery }
  - { id: hills, type: hillshade, source: elevation }
    </script>
  </ml-map>
  <script type="module" src="/cdn/@maplibre-yaml/core@0.9.0/register.js"></script>
</body>
</html>
