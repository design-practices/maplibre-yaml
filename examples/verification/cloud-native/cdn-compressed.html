<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A compressed FlatGeobuf from the CDN build</title>
  <!--
    ml-aot.109: a Zstandard-compressed .fgb on a plain CDN page (import map
    with only maplibre-gl). PASS = the map draws, and its notice says the file
    is compressed and how to write it uncompressed; no module-resolution
    error in the console, no request for @bokuweb/zstd-wasm.
    Serve from the repo root:  pnpm verify:serve
    Then open: http://localhost:4174/examples/verification/cloud-native/cdn-compressed.html
  -->
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 8px 16px; background: #1d3557; color: white; font-size: 13px; }
    ml-map { display: block; height: 420px; }
  </style>
  <script type="importmap">
    { "imports": { "maplibre-gl": "/vendor/maplibre-gl.esm.js" } }
  </script>
</head>
<body>
  <header>CDN build, compressed FlatGeobuf — PASS = a notice saying the file is compressed.</header>
  <ml-map id="map">
    <script type="text/yaml">
type: map
id: cloud-native-compressed
config:
  center: [10.2, 42.15]
  zoom: 9.6
  mapStyle: "/examples/verification/configs/local-style.json"
sources:
  districts:
    type: geojson
    url: /examples/verification/data/districts-zstd.fgb
layers:
  - { id: districts, type: fill, source: districts, paint: { fill-color: "#2a9d8f" } }
    </script>
  </ml-map>
  <script type="module" src="/cdn/@maplibre-yaml/core@0.9.0/register.js"></script>
</body>
</html>
