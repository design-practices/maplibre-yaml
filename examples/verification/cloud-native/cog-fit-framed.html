<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fitTo on a COG: framed on load</title>
  <!--
    ml-aot.120 — fitTo on a COG builds the map already framed, as for a
    .geojson or FlatGeobuf file: <ml-map> reads the GeoTIFF's header (its
    first 64 KB) while the page starts, takes the extent from its
    georeferencing, and builds the map with it — within the same fitTo wait
    (MLMap.fitToWaitMs). The COG reader reuses that read: the header is
    requested ONCE.
    PASS = opens on the imagery — no world view first, no jump.
    Serve from the repo root:  pnpm verify:serve
    Then open: http://localhost:4174/examples/verification/cloud-native/cog-fit-framed.html
  -->
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 8px 16px; background: #1d3557; color: white; font-size: 13px; }
    main { padding: 12px 16px; }
    ml-map { display: block; height: 420px; }
    #camera { font: 12px ui-monospace, monospace; margin-top: 6px; }
  </style>
  <script type="importmap">
    { "imports": { "maplibre-gl": "/vendor/maplibre-gl.esm.js" } }
  </script>
  <script>
    // Record the camera of the map's very first frame (and any move after
    // it): the canvas appears in the same task that builds the map.
    window.__frames = { first: null, moves: 0 };
    new MutationObserver((records, observer) => {
      const el = document.querySelector("ml-map");
      const map = el && el.getMap && el.getMap();
      if (!map) return;
      observer.disconnect();
      const camera = () => {
        const c = map.getCenter();
        return { lng: c.lng, lat: c.lat, zoom: map.getZoom() };
      };
      map.once("render", () => { window.__frames.first = camera(); });
      map.on("move", () => { if (window.__frames.first) window.__frames.moves += 1; });
      map.once("idle", () => {
        const f = window.__frames.first;
        document.getElementById("camera").textContent =
          `first frame: ${f.lng.toFixed(3)}, ${f.lat.toFixed(3)} z${f.zoom.toFixed(2)} — ` +
          `camera moves after the first frame: ${window.__frames.moves}`;
      });
    }).observe(document.documentElement, { childList: true, subtree: true });
  </script>
</head>
<body>
  <header>PASS = opens on the imagery (a COG) — no world view first, no jump.</header>
  <main>
    <ml-map id="map">
      <script type="text/yaml">
type: map
id: cog-fit-framed
config:
  center: [0, 0]
  zoom: 1
  mapStyle: "/examples/verification/configs/local-style.json"
  fitTo:
    source: imagery
    padding: 20
sources:
  imagery:
    type: raster
    url: /gallery-assets/cloud-native/imagery.cog.tif
layers:
  - id: imagery
    type: raster
    source: imagery
      </script>
    </ml-map>
    <div id="camera">first frame: …</div>
  </main>
  <script type="module" src="../../../packages/core/register.js"></script>
</body>
</html>
