<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A JPEG-compressed COG from the CDN build</title>
  <!--
    0.9 (ml-cnv.11): the COG reader keeps its heavier image codecs (JPEG,
    LERC, ZSTD, DEFLATE) out of chunks/cog.js, in chunks/cog-<codec>.js next
    to it. The tiles themselves are decoded in the reader's background
    workers, which carry every codec, so drawing this JPEG COG fetches the
    bundle and chunks/cog.js only; the cog-<codec>.js files serve decoding
    on the page itself.
    PASS = the island imagery (slightly softer: JPEG), no notice.
    Serve from the repo root:  pnpm verify:serve
    Then open: http://localhost:4174/examples/verification/cloud-native/cdn-cog-jpeg.html
  -->
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 8px 16px; background: #1d3557; color: white; font-size: 13px; }
    ml-map { display: block; height: 420px; }
  </style>
  <script type="importmap">
    { "imports": { "maplibre-gl": "/vendor/maplibre-gl.esm.js" } }
  </script>
</head>
<body>
  <header>CDN build, a JPEG-compressed COG — PASS = island imagery, no notice.</header>
  <ml-map id="map">
    <script type="text/yaml">
type: map
id: cog-jpeg
config:
  center: [10.2, 42.15]
  zoom: 9.6
  mapStyle: "/examples/verification/configs/local-style.json"
sources:
  imagery:
    type: raster
    url: /gallery-assets/cloud-native/imagery-jpeg.cog.tif
layers:
  - { id: imagery, type: raster, source: imagery }
    </script>
  </ml-map>
  <script type="module" src="/cdn/@maplibre-yaml/core@0.9.0/register.js"></script>
</body>
</html>
