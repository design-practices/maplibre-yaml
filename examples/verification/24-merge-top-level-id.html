<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Live merge: top-level ids and keyless features</title>
  <!--
    ml-aot.141. Both maps poll every second with `updateStrategy: merge`.
    PASS = both maps keep their dots after the first poll (the left one
    matches USGS-style top-level ids; the right one's features have no key
    at all and are kept, with an author note saying so). FAIL = a map
    empties a second after it loads.
    Serve from the repo root:  pnpm verify:serve
    Then open: http://localhost:4174/examples/verification/24-merge-top-level-id.html
  -->
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 8px 16px; background: #1d3557; color: white; font-size: 13px; }
    .maps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    ml-map { display: block; height: 420px; }
  </style>
  <script type="importmap">
    { "imports": { "maplibre-gl": "/vendor/maplibre-gl.esm.js" } }
  </script>
</head>
<body>
  <header>PASS = both maps keep their dots after each one-second poll. FAIL = a map empties.</header>
  <div class="maps">
    <ml-map id="by-id" src="./configs/merge-top-level-id.yaml"></ml-map>
    <ml-map id="keyless" src="./configs/merge-keyless.yaml"></ml-map>
  </div>
  <script type="module" src="../../packages/core/register.js"></script>
</body>
</html>
