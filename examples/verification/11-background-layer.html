<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Background layer</title>
  <!--
    PASS = a dark translucent wash over the whole map with a red circle on
    top (the background layer rendered AND the document kept going). FAIL =
    plain green basemap with no wash and no circle: the background layer
    threw during source resolution and killed the document.
    Serve from the repo root:  pnpm verify:serve
    Then open: http://localhost:4174/examples/verification/11-background-layer.html
  -->
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 8px 16px; background: #1d3557; color: white; font-size: 13px; }
    ml-map { display: block; height: 460px; }
  </style>
  <script type="importmap">
    { "imports": { "maplibre-gl": "/vendor/maplibre-gl.esm.js" } }
  </script>
</head>
<body>
  <header>PASS = dark translucent wash + red circle. FAIL = plain green basemap.</header>
  <ml-map id="map" src="./configs/background-layer.yaml"></ml-map>
  <script type="module" src="../../packages/core/register.js"></script>
</body>
</html>
