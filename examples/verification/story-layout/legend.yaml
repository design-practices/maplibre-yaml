type: scrollytelling
id: story-legend
showMarkers: true
config:
  mapStyle: "/examples/verification/configs/local-style.json"
  center: [0, 20]
  zoom: 2
controls:
  scale: true
legend:
  title: Places
  items:
    - { label: Volcano, color: "#d62828", shape: circle }
    - { label: Town, color: "#f77f00", shape: circle }
    - { label: Port, color: "#3b82f6", shape: circle }
layers:
  - id: pts
    type: circle
    source:
      type: geojson
      data:
        type: FeatureCollection
        features:
          - { type: Feature, properties: {}, geometry: { type: Point, coordinates: [10, 40] } }
          - { type: Feature, properties: {}, geometry: { type: Point, coordinates: [-20, 10] } }
          - { type: Feature, properties: {}, geometry: { type: Point, coordinates: [60, -10] } }
    paint: { circle-radius: 8, circle-color: "#d62828" }
chapters:
  - id: first
    title: A centred card
    description: "<p>A centred card. The legend stays pinned in its corner while this card scrolls past; nothing on the map moves with the scroll.</p>"
    center: [10, 40]
    zoom: 3
    image: photo.svg
  - id: gap
    title: A map-only moment
    hidden: true
    center: [-20, 10]
    zoom: 3
  - id: second
    title: Another centred card
    description: "<p>Another centred card. The legend stays pinned in its corner while this card scrolls past; nothing on the map moves with the scroll.</p>"
    center: [-20, 10]
    zoom: 3
  - id: third
    title: The last centred card
    description: "<p>The last centred card. The legend stays pinned in its corner while this card scrolls past; nothing on the map moves with the scroll.</p>"
    center: [60, -10]
    zoom: 3
footer: "<p>The end of the story.</p>"
