<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scale bar vs compact attribution</title>
  <!--
    ml-aot.38 — the ml-aot.26 fix collapsed MapLibre's compact attribution
    only for bottom-left CHROME (legend, slots). A scale bar (controls:
    scale: true, bottom-left) with the legend elsewhere stayed hidden under
    the expanded attribution on a phone until the first drag.
    PASS (open at ~390px wide) = the scale bar is readable and the
    attribution is the small (i) button. FAIL = the attribution text covers
    the scale bar. Serve from the repo root (pnpm verify:serve), then open
    /examples/verification/16-scale-clear-of-attribution.html
  -->
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    ml-map { display: block; width: 100vw; height: 100vh; }
  </style>
  <script type="importmap">
    { "imports": { "maplibre-gl": "/vendor/maplibre-gl.esm.js" } }
  </script>
</head>
<body>
  <ml-map id="map">
    <script type="text/yaml">
type: map
id: scale-clear-of-attribution
config:
  center: [0, 20]
  zoom: 1.6
  mapStyle: "/examples/verification/configs/local-style.json"
controls:
  scale: true
  attribution:
    position: bottom-right
    customAttribution: "Data © Example Volcano Survey contributors, basemap © a long list of map makers that wraps on a phone"
legend:
  position: top-left
  title: Volcanoes
layers:
  - id: active
    type: circle
    legend: { label: Active, color: "#d62828" }
    source:
      type: geojson
      data:
        type: FeatureCollection
        features:
          - type: Feature
            geometry: { type: Point, coordinates: [10, 20] }
            properties: {}
    paint: { circle-radius: 6, circle-color: "#d62828" }
    </script>
  </ml-map>
  <script type="module" src="/packages/core/register.js"></script>
</body>
</html>
