<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>src returns HTML</title>
  <!--
    ml-aot.13 — a wrong src path on a server with an SPA fallback returns a
    web page with status 200 (not-yaml.html stands in for it). PASS = a card
    saying src points at an HTML page and the path is probably wrong.
    FAIL = "YAML syntax error … <!doctype html>".
    Serve from the repo root:  pnpm verify:serve
    Then open: http://localhost:4174/examples/verification/student-errors/src-html.html
  -->
  <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    header { padding: 8px 16px; background: #1d3557; color: white; font-size: 13px; }
    main { padding: 12px 16px; }
    ml-map { display: block; height: 420px; margin-bottom: 16px; }
    h2 { font-size: 14px; margin: 16px 0 6px; }
  </style>
  <script type="importmap">
    { "imports": { "maplibre-gl": "/vendor/maplibre-gl.esm.js" } }
  </script>
</head>
<body>
  <header>PASS = card "src=… points at an HTML page, not a YAML file". FAIL = a YAML syntax error about &lt;!doctype html&gt;.</header>
  <main>
    <ml-map id="map" src="not-yaml.html"></ml-map>
  </main>
  <script type="module" src="../../../packages/core/register.js"></script>
</body>
</html>
