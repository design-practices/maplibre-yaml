# U3 assertion: controls.attribution renders exactly ONE attribution control,
# and MapLibre's built-in default does not double-render alongside it.
type: map
id: u3-attribution
config:
  center: [-74.006, 40.7128]
  zoom: 11
  mapStyle: "/examples/verification/configs/local-style.json"
controls:
  navigation: true
  attribution:
    position: bottom-right
    customAttribution: "U3 ATTRIBUTION OK"
layers: []
