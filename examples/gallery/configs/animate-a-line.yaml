# Hermetic twin of docs/public/configs/gallery/animate-a-line.yaml (local basemap;
# driven by the SAME page JS and chrome) — see https://maplibre.org/maplibre-gl-js/docs/examples/animate-a-line/
# The YAML half: the line layer and its styling, starting as a stub. The
# animation loop grows it through <ml-map>'s updateLayerData() — see
# animate-a-line.js.
type: map
id: animate-a-line
config:
  center: [0, 0]
  zoom: 0.5
  mapStyle: "/examples/verification/configs/local-style.json"
layers:
  - id: line-animation
    type: line
    source:
      type: geojson
      route:
        coordinates: [[0, 0], [0.5, 0.2]]
    layout:
      line-cap: round
      line-join: round
    paint:
      line-color: "#ed6498"
      line-width: 5
      line-opacity: 0.8
