# Hermetic twin of docs/public/configs/gallery/animate-a-series-of-images.yaml (local basemap;
# driven by the SAME page JS and chrome) — see https://maplibre.org/maplibre-gl-js/docs/examples/animate-a-series-of-images/
# The YAML half: an `image` source pinned to four corners, drawn by a
# raster layer, showing the first radar frame. Stepping through the other
# frames is a timer calling the source's updateImage() — see
# animate-a-series-of-images.js.
type: map
id: animate-a-series-of-images
config:
  center: [-75.789, 41.874]
  zoom: 5
  minZoom: 4
  maxZoom: 5.99
  mapStyle: "/examples/verification/configs/local-style.json"
layers:
  - id: radar-layer
    type: raster
    source:
      type: image
      url: "/gallery-assets/radar0.gif"
      coordinates:
        - [-80.425, 46.437]
        - [-71.516, 46.437]
        - [-71.516, 37.936]
        - [-80.425, 37.936]
    paint:
      raster-fade-duration: 0
