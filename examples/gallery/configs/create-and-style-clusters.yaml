# Hermetic twin of docs/public/configs/gallery/create-and-style-clusters.yaml.
# The named source uses a LOCAL url: — same load path as the docs config
# (named source -> DataFetcher -> setData), which is the path that silently
# broke pre-ml-blj while inline-data twins stayed green. Twin-fidelity rule:
# twins share the load MECHANISM, not just the document shape.
# Other hermeticity deltas: no cluster-count symbol layer (the local
# verification style ships no glyphs), and the camera sits over the sample
# data so the cluster is deterministically on screen.
type: map
id: create-and-style-clusters
config:
  center: [-118.25, 34.05]
  zoom: 5
  mapStyle: "/examples/verification/configs/local-style.json"
sources:
  earthquakes:
    type: geojson
    url: "/examples/verification/data/quakes-sample.geojson"
    cluster: true
    clusterMaxZoom: 14
    clusterRadius: 50
layers:
  - id: clusters
    type: circle
    source: earthquakes
    filter: ["has", "point_count"]
    paint:
      circle-color:
        ["step", ["get", "point_count"], "#51bbd6", 100, "#f1f075", 750, "#f28cb1"]
      circle-radius: ["step", ["get", "point_count"], 20, 100, 30, 750, 40]
    interactive:
      hover:
        cursor: pointer
      click:
        zoomToFeature:
          maxZoom: 12
  - id: unclustered-point
    type: circle
    source: earthquakes
    filter: ["!", ["has", "point_count"]]
    paint:
      circle-color: "#11b4da"
      circle-radius: 4
      circle-stroke-width: 1
      circle-stroke-color: "#ffffff"
    interactive:
      click:
        popup:
          - h4:
              - str: Earthquake
          - p:
              - str: "Magnitude: "
              - property: mag
