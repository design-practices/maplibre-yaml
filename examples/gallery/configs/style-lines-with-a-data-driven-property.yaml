# Hermetic twin of docs/public/configs/gallery/style-lines-with-a-data-driven-property.yaml (local basemap).
type: map
id: style-lines-with-a-data-driven-property
config:
  center: [-122.4833, 37.829]
  zoom: 14
  mapStyle: "/examples/verification/configs/local-style.json"
layers:
