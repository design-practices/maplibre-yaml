# Hermetic twin of docs/public/configs/gallery/fit-to-the-bounds-of-a-linestring.yaml
# (local basemap). The authored center/zoom are deliberately far from the
# line — the camera only frames the route if fitTo did its job.
type: map
id: fit-to-the-bounds-of-a-linestring
config:
  center: [0, 0]
  zoom: 2
  mapStyle: "/examples/verification/configs/local-style.json"
  fitTo:
    source: route
    padding: 20
sources:
  route:
    type: geojson
    data:
      type: FeatureCollection
      features:
        - type: Feature
          properties: {}
          geometry:
            type: LineString
            coordinates:
              - [-77.0366048812866, 38.89873175227713]
              - [-77.03364372253417, 38.89876515143842]
              - [-77.03364372253417, 38.89549195896866]
              - [-77.02982425689697, 38.89549195896866]
              - [-77.02400922775269, 38.89387200688839]
              - [-77.01519012451172, 38.891416957534204]
              - [-77.01521158218382, 38.892068305429156]
              - [-77.00813055038452, 38.892051604275686]
              - [-77.00832366943358, 38.89143365883688]
              - [-77.00818419456482, 38.89082405874451]
              - [-77.00815200805664, 38.88989712255097]
layers:
  - id: route
    type: line
    source: route
    layout:
      line-join: round
      line-cap: round
    paint:
      line-color: "#BF93E4"
      line-width: 5
