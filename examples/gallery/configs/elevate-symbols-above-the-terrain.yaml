# Hermetic twin of docs/public/configs/gallery/elevate-symbols-above-the-terrain.yaml
# (U18). The e2e server's synthetic relief (/relief, terrarium) and landcover
# raster stand in for mapterhorn and OSM; the balloons layer is identical.
# Like the docs page the base style has no glyphs URL, so maplibre-gl draws
# the labels with local fonts. Needs maplibre-gl >= 6.6.0 (the spec skips below).
type: map
id: elevate-symbols-above-the-terrain
config:
  center: [11.39085, 47.27574]
  zoom: 13
  pitch: 75
  maxZoom: 18
  maxPitch: 85
  mapStyle: { version: 8, sources: {}, layers: [] }
sources:
  osm:
    type: raster
    tiles:
      - "/landcover/{z}/{x}/{y}.png"
    tileSize: 256
    attribution: "synthetic local tiles"
  terrainSource:
    type: raster-dem
    tiles:
      - "/relief/{z}/{x}/{y}.png"
    encoding: terrarium
    tileSize: 256
    maxzoom: 14
layers:
  - id: osm
    type: raster
    source: osm
  - id: balloons
    type: symbol
    source:
      type: geojson
      data:
        type: FeatureCollection
        features:
          - { type: Feature, properties: { label: "0 m", height: 0 }, geometry: { type: Point, coordinates: [11.385, 47.276] } }
          - { type: Feature, properties: { label: "500 m", height: 500 }, geometry: { type: Point, coordinates: [11.390, 47.276] } }
          - { type: Feature, properties: { label: "1500 m", height: 1500 }, geometry: { type: Point, coordinates: [11.395, 47.276] } }
    layout:
      symbol-placement: point
      symbol-height-offset: ["get", "height"]
      text-field: ["get", "label"]
      text-size: 16
      text-allow-overlap: true
    paint:
      text-color: "#1b6"
      text-halo-color: "#fff"
      text-halo-width: 2
terrain:
  source: terrainSource
  exaggeration: 1
sky: {}
controls:
  navigation: true
