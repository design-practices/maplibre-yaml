# Hermetic twin of docs/public/configs/gallery/update-a-feature-in-realtime.yaml.
# Polls a local static file with the same merge-by-id strategy as the docs
# config (the payload never changes, but the merge poll loop is the
# machinery under test).
type: map
id: update-a-feature-in-realtime
config:
  center: [-120, 40.2]
  zoom: 7
  mapStyle: "/examples/verification/configs/local-style.json"
layers:
  - id: quakes-live
    type: circle
    source:
      type: geojson
      url: "/examples/gallery/data/quakes-ids.geojson"
      cache:
        enabled: false
      refresh:
        refreshInterval: 1000
        updateStrategy: merge
        updateKey: id
    paint:
      circle-radius:
        ["interpolate", ["linear"], ["get", "mag"], 1, 4, 6, 24]
      circle-color: "#e63946"
      circle-opacity: 0.7
