# Hermetic twin of docs/public/configs/gallery/display-a-popup-on-hover.yaml
# (local basemap, same interactive block).
type: map
id: display-a-popup-on-hover
config:
  center: [-100.04, 38.907]
  zoom: 3
  mapStyle: "/examples/verification/configs/local-style.json"
layers:
  - id: places
    type: circle
    source:
      type: geojson
      generateId: true
      data:
        type: FeatureCollection
        features:
          - type: Feature
            geometry: { type: Point, coordinates: [-77.032, 38.913] }
            properties:
              title: Washington DC
              description: The nation's capital
          - type: Feature
            geometry: { type: Point, coordinates: [-122.414, 37.776] }
            properties:
              title: San Francisco
              description: Fog, hills, and sourdough
          - type: Feature
            geometry: { type: Point, coordinates: [-87.65, 41.84] }
            properties:
              title: Chicago
              description: The city of big shoulders
    paint:
      circle-radius: 8
      circle-color: "#2a6f97"
      circle-stroke-width: 2
      circle-stroke-color: "#ffffff"
    interactive:
      hover:
        cursor: pointer
        popup:
          - h3:
              - property: title
          - p:
              - property: description
      click:
        popup:
          - h3:
              - property: title
          - p:
              - property: description
