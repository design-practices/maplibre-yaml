# Hermetic twin of docs/public/configs/gallery/center-the-map-on-a-clicked-symbol.yaml (local basemap).
type: map
id: center-the-map-on-a-clicked-symbol
config:
  center: [-90.96, -0.47]
  zoom: 7.5
  mapStyle: "/examples/verification/configs/local-style.json"
layers:
  - id: islands
    type: circle
    source:
      type: geojson
      locations:
        - { coordinates: [-91.395, -0.9538], name: Isabela }
        - { coordinates: [-90.3295, -0.6344], name: Santa Cruz }
        - { coordinates: [-89.6293, -0.8933], name: San Cristóbal }
        - { coordinates: [-90.7514, 0.3199], name: Genovesa }
    paint:
      circle-radius: 9
      circle-color: "#2a9d8f"
      circle-stroke-width: 2
      circle-stroke-color: "#ffffff"
    interactive:
      hover:
        cursor: pointer
      click:
        zoomToFeature:
          maxZoom: 10
