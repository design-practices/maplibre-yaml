# Hermetic twin of docs/public/configs/gallery/fill-extrusion-rounded-corners.yaml
# (U18). The buildings come from the vendored lower-Manhattan fixture
# (examples/gallery/fixtures/omt — OpenStreetMap data, ODbL) instead of the
# openfreemap basemap's source; the layer, its parameters and its state are
# identical. Needs maplibre-gl >= 6.2.0 (e2e/gallery-u18.spec.ts skips below).
type: map
id: fill-extrusion-rounded-corners
config:
  center: [-74.0066, 40.7135]
  zoom: 15.5
  pitch: 45
  bearing: -17.6
  mapStyle: "/examples/verification/configs/local-style.json"
state:
  heightScale:
    default: 1
  opacity:
    default: 0.8
parameters:
  heightScale:
    label: Height multiplier
    type: range
    min: 0
    max: 3
    step: 0.1
  opacity:
    label: Opacity
    type: range
    min: 0
    max: 1
    step: 0.05
sources:
  openmaptiles:
    type: vector
    tiles: ["/examples/gallery/fixtures/omt/{z}/{x}/{y}.pbf"]
    minzoom: 13
    maxzoom: 14
    bounds: [-74.035, 40.695, -73.985, 40.735]
    attribution: "© OpenMapTiles © OpenStreetMap contributors"
layers:
  - id: building-extrusion
    type: fill-extrusion
    source: openmaptiles
    source-layer: building
    minzoom: 14
    filter: ["!=", ["get", "hide_3d"], true]
    layout:
      fill-extrusion-rounded-corner-distance: 2
    paint:
      fill-extrusion-color:
        ["interpolate", ["linear"], ["get", "render_height"], 0, "lightgray", 200, "royalblue", 400, "lightblue"]
      fill-extrusion-height: ["*", ["global-state", "heightScale"], ["get", "render_height"]]
      fill-extrusion-base: ["*", ["global-state", "heightScale"], ["get", "render_min_height"]]
      fill-extrusion-opacity: ["global-state", "opacity"]
