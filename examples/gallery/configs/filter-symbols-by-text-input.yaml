# Hermetic twin of docs/public/configs/gallery/filter-symbols-by-text-input.yaml (local basemap;
# driven by the SAME page JS and chrome) — see https://maplibre.org/maplibre-gl-js/docs/examples/filter-symbols-by-text-input/
# The YAML half: the places and ONE symbol layer whose filter reads a
# `query` state key — a place shows while its icon name contains the
# query. The params panel has no free-text control, so the search box is
# page chrome in a corner slot and its JS writes the state key — see
# filter-symbols-by-text-input.js. (maplibre-gl >= 5.6 for global-state.)
type: map
id: filter-symbols-by-text-input
config:
  center: [-77.04, 38.907]
  zoom: 11.15
  mapStyle: "/examples/verification/configs/local-style.json"
state:
  query:
    default: ""
# Hermetic stand-ins for the remote basemap's sprite icons.
images:
  theatre_11: "/examples/gallery/assets/icon-a.png"
  bar_11: "/examples/gallery/assets/icon-b.png"
  bicycle_11: "/examples/gallery/assets/icon-a.png"
  music_11: "/examples/gallery/assets/icon-b.png"
layers:
  - id: poi
    type: symbol
    source:
      type: geojson
      data:
        type: FeatureCollection
        features:
          - { type: Feature, properties: { icon: theatre }, geometry: { type: Point, coordinates: [-77.038659, 38.931567] } }
          - { type: Feature, properties: { icon: theatre }, geometry: { type: Point, coordinates: [-77.003168, 38.894651] } }
          - { type: Feature, properties: { icon: bar }, geometry: { type: Point, coordinates: [-77.090372, 38.881189] } }
          - { type: Feature, properties: { icon: bicycle }, geometry: { type: Point, coordinates: [-77.052477, 38.943951] } }
          - { type: Feature, properties: { icon: music }, geometry: { type: Point, coordinates: [-77.031706, 38.914581] } }
          - { type: Feature, properties: { icon: music }, geometry: { type: Point, coordinates: [-77.020945, 38.878241] } }
          - { type: Feature, properties: { icon: music }, geometry: { type: Point, coordinates: [-77.007481, 38.876516] } }
    filter: ["in", ["global-state", "query"], ["get", "icon"]]
    layout:
      icon-image: ["concat", ["get", "icon"], "_11"]
      icon-overlap: always
      text-field: ["get", "icon"]
      text-font: ["Noto Sans Regular"]
      text-size: 11
      text-transform: uppercase
      text-letter-spacing: 0.05
      text-offset: [0, 1.5]
    paint:
      text-color: "#202"
      text-halo-color: "#fff"
      text-halo-width: 2
