# Hermetic twin of docs/public/configs/gallery/filter-within-a-layer.yaml (local basemap;
# driven by the SAME JS file the docs page loads).
type: map
id: filter-within-a-layer
config:
  center: [-118.25, 34.05]
  zoom: 7
  mapStyle: "/examples/verification/configs/local-style.json"
layers:
  - id: quakes
    type: circle
    filter: [">=", ["get", "mag"], 2]
    source:
      type: geojson
      data:
        type: FeatureCollection
        features:
          - { type: Feature, geometry: { type: Point, coordinates: [-118.2, 34.1] }, properties: { mag: 4.4 } }
          - { type: Feature, geometry: { type: Point, coordinates: [-118.3, 34.0] }, properties: { mag: 2.9 } }
          - { type: Feature, geometry: { type: Point, coordinates: [-118.25, 34.05] }, properties: { mag: 3.6 } }
          - { type: Feature, geometry: { type: Point, coordinates: [-118.1, 34.2] }, properties: { mag: 5.1 } }
          - { type: Feature, geometry: { type: Point, coordinates: [-118.4, 33.9] }, properties: { mag: 2.2 } }
          - { type: Feature, geometry: { type: Point, coordinates: [-118.15, 34.0] }, properties: { mag: 3.9 } }
          - { type: Feature, geometry: { type: Point, coordinates: [-118.35, 34.15] }, properties: { mag: 4.7 } }
          - { type: Feature, geometry: { type: Point, coordinates: [-118.28, 34.08] }, properties: { mag: 3.2 } }
    paint:
      circle-radius: ["interpolate", ["linear"], ["get", "mag"], 2, 5, 6, 18]
      circle-color: "#e63946"
      circle-opacity: 0.75
