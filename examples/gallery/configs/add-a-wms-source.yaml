# Hermetic twin of docs/public/configs/gallery/add-a-wms-source.yaml.
# No local WMS endpoint exists; the WMS-ness of the original is only its URL
# template, so the twin proves the same raster source/layer pipeline against
# the local tile endpoint.
type: map
id: add-a-wms-source
config:
  center: [-74.5447, 40.6892]
  zoom: 8
  mapStyle: "/examples/verification/configs/local-style.json"
layers:
  - id: wms-imagery
    type: raster
    source:
      type: raster
      tiles:
        - "/dem/{z}/{x}/{y}.png"
      tileSize: 256
    paint:
      raster-opacity: 0.9
