# Hermetic twin of docs/public/configs/gallery/sky-fog-terrain.yaml (U15).
# Local basemap, synthetic /landcover + /relief tiles; the sky block is
# identical to the docs page.
type: map
id: sky-fog-terrain
config:
  center: [11.2953, 47.5479]
  zoom: 12
  pitch: 77
  maxZoom: 18
  maxPitch: 85
  mapStyle: "/examples/verification/configs/local-style.json"
sources:
  osm:
    type: raster
    tiles:
      - "/landcover/{z}/{x}/{y}.png"
    tileSize: 256
    attribution: "synthetic local tiles"
  terrainSource:
    type: raster-dem
    tiles:
      - "/relief/{z}/{x}/{y}.png"
    encoding: terrarium
    tileSize: 256
    maxzoom: 14
  hillshadeSource:
    type: raster-dem
    tiles:
      - "/relief/{z}/{x}/{y}.png"
    encoding: terrarium
    tileSize: 256
    maxzoom: 14
layers:
  - id: osm
    type: raster
    source: osm
  - id: hills
    type: hillshade
    source: hillshadeSource
    paint:
      hillshade-shadow-color: "#473B24"
terrain:
  source: terrainSource
  exaggeration: 1
sky:
  sky-color: "#0000ff"
  horizon-color: "#00ff00"
  fog-color: "#ff0000"
  sky-horizon-blend: 0.5
  horizon-fog-blend: 0.5
  fog-ground-blend: 0.1
controls:
  navigation: true
  globe: true
  terrain: true
