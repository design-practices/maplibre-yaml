# Hermetic twin of docs/public/configs/gallery/add-an-icon-to-the-map.yaml (local basemap + icon).
type: map
id: add-an-icon-to-the-map
config:
  center: [0, 0]
  zoom: 1
  mapStyle: "/examples/verification/configs/local-style.json"
images:
  osgeo-logo: "/examples/gallery/assets/icon-a.png"
sources:
  point:
    type: geojson
    data:
      type: FeatureCollection
      features:
        - type: Feature
          geometry: { type: Point, coordinates: [0, 0] }
          properties: {}
layers:
  - id: logo
    type: symbol
    source: point
    layout:
      icon-image: osgeo-logo
