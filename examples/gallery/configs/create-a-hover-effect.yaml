# Hermetic twin of docs/public/configs/gallery/create-a-hover-effect.yaml.
# Matches the docs page's LOAD MODE (url-fetched geojson + generateId +
# highlight) against a local file — the twin-fidelity rule.
type: map
id: create-a-hover-effect
config:
  center: [-100.486, 38.0]
  zoom: 3
  mapStyle: "/examples/verification/configs/local-style.json"
layers:
  - id: states
    type: fill
    source:
      type: geojson
      url: "/examples/gallery/data/states-sample.geojson"
      generateId: true
    paint:
      fill-color: "#627BC1"
      fill-opacity: 0.6
    interactive:
      hover:
        highlight: true
        cursor: pointer
