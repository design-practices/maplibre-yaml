# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
# Loaded at build time: `await loadMapConfig("./src/maps/ring-of-fire.yaml")`
# in src/pages/index.astro, then handed to <Map config={...}>.
type: map
id: ring-of-fire
config:
  center: [-170, 12]
  zoom: 1.15
  mapStyle: "https://tiles.openfreemap.org/styles/positron"
layers:
  - id: ring
    type: line
    source:
      type: geojson
      url: "/data/ring-of-fire.geojson"
    paint:
      line-color: "#e4572e"
      line-width: 3
      line-opacity: 0.7
      line-blur: 1
  - id: volcanoes
    type: circle
    source:
      type: geojson
      url: "/data/volcanoes.geojson"
    paint:
      circle-radius: 6
      circle-color: "#b5231b"
      circle-stroke-width: 1.5
      circle-stroke-color: "#ffffff"
    interactive:
      hover:
        cursor: pointer
        popup:
          - h3:
              - property: name
          - p:
              - property: country
              - str: " · "
              - property: elevation
              - str: " m"
