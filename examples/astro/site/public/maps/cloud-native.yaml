# Cloud-native data (0.9): a PMTiles archive and a FlatGeobuf file, named in
# YAML like any other file — no page JavaScript. Synthetic, public-domain
# fixtures (scripts/fixtures/cloud-native.py) in public/data/cloud-native/.
# Both formats are read with HTTP range requests (or, for .fgb, one plain
# download): astro dev, astro preview and GitHub Pages all serve them.
type: map
id: cloud-native
config:
  center: [10.2, 42.15]
  zoom: 8
  mapStyle: https://tiles.openfreemap.org/styles/positron
  fitTo: { source: districts, padding: 24 }
legend:
  title: District plan
sources:
  outlines:
    type: vector
    url: /data/cloud-native/districts.pmtiles
  districts:
    type: geojson
    url: /data/cloud-native/districts.fgb
layers:
  - id: districts
    type: fill
    source: districts
    paint:
      fill-color: ["match", ["get", "category"], "park", "#2a9d8f", "residential", "#e9c46a", "industrial", "#e76f51", "#8d99ae"]
      fill-opacity: 0.6
    legend: { label: "Districts (FlatGeobuf)", color: "#e9c46a", shape: square }
    interactive:
      click:
        popup:
          - h3: [{ property: name }]
          - p: [{ str: "Population " }, { property: population }]
  - id: outlines
    type: line
    source: outlines
    source-layer: districts
    paint: { line-color: "#1d3557", line-width: 1.2 }
    legend: { label: "Outlines (PMTiles)", color: "#1d3557", shape: line }
